version: 2

sources:
  - name: web
    description: Website clickstream (ad clicks, email opens, page views, purchases).
    database: RETAIL_RAW
    schema: WEB
    loader: snowpipe
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: events
        identifier: EVENTS
