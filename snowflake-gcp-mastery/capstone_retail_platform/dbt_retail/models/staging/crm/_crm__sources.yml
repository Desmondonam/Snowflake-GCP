version: 2

sources:
  - name: crm
    description: Loyalty CRM extract (full on day 1, then changes). Contains PII.
    database: RETAIL_RAW
    schema: CRM
    loader: snowpipe
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: customers
        identifier: CUSTOMERS
        description: One VARIANT per customer change record.
