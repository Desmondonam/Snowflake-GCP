version: 2

models:
  - name: stg_crm__customer_changes
    description: >
      Every customer change record, typed out of VARIANT (history). One row per (customer_id, updated_at).
      This is the input for SCD2 (int_customer_versions).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, updated_at]
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['VALUE', 'MAINSTREAM', 'PREMIUM']
      - name: loyalty_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['BRONZE', 'SILVER', 'GOLD', 'PLATINUM']

  - name: stg_crm__customers
    description: Current state of each customer (latest change wins). One row per customer_id.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [unique, not_null]
      - name: loyalty_id
        data_tests: [unique]
